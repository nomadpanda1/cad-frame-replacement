<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CAD 图框置换</title>
<style>
  :root { --bg:#0f1419; --card:#1a2029; --line:#2a323d; --txt:#e6edf3; --sub:#8b949e;
          --acc:#3b82f6; --ok:#22c55e; --err:#ef4444; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,Segoe UI,Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
         background:var(--bg); color:var(--txt); }
  .wrap { max-width:980px; margin:0 auto; padding:32px 20px 64px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--sub); font-size:13px; margin-bottom:24px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; margin-bottom:20px; }
  .drop { border:2px dashed var(--line); border-radius:12px; padding:36px 20px; text-align:center;
          cursor:pointer; transition:.15s; }
  .drop.over { border-color:var(--acc); background:rgba(59,130,246,.08); }
  .drop p { margin:6px 0; color:var(--sub); }
  .drop .big { color:var(--txt); font-size:15px; }
  .row { display:flex; gap:16px; flex-wrap:wrap; align-items:center; margin-top:16px; }
  label { font-size:13px; color:var(--sub); }
  select, .btn { font-size:14px; padding:8px 12px; border-radius:8px; border:1px solid var(--line);
                 background:#0f1419; color:var(--txt); }
  .btn { background:var(--acc); border-color:var(--acc); cursor:pointer; font-weight:600; }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  .chk { display:flex; align-items:center; gap:6px; color:var(--sub); font-size:13px; }
  .status { margin-top:14px; font-size:13px; }
  .status.err { color:var(--err); }
  .status.run { color:var(--acc); }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media(max-width:640px){ .grid{grid-template-columns:1fr;} }
  .pv { background:#000; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .pv .cap { font-size:12px; color:var(--sub); padding:8px 10px; border-bottom:1px solid var(--line); }
  .pv img { width:100%; display:block; background:#000; }
  .dl { margin-top:14px; display:flex; gap:12px; flex-wrap:wrap; }
  .dl a { color:var(--acc); text-decoration:none; font-size:14px; border:1px solid var(--line);
          padding:8px 14px; border-radius:8px; }
  .dl a:hover { border-color:var(--acc); }
  .diag { margin-top:14px; font-size:12px; color:var(--sub); white-space:pre-wrap;
          background:#0f1419; border:1px solid var(--line); border-radius:8px; padding:10px; }
  .hidden { display:none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>CAD 图框置换</h1>
  <div class="sub">上传 DWG / DXF，自动按幅面套用公司标准图框（HH_FRAME）。DWG 在服务器经无头转换器处理后同样处理。</div>

  <div class="card">
    <div class="drop" id="drop">
      <p class="big">点击或拖拽文件到此处</p>
      <p>支持 .dxf / .dwg（单文件）</p>
      <input type="file" id="file" accept=".dxf,.dwg" class="hidden" />
    </div>
    <div class="row">
      <div><label>模板</label><br/>
        <select id="tpl"><option value="auto">自动（按幅面检测）</option></select>
      </div>
      <div><label>适配</label><br/>
        <select id="fit"><option value="max">max（整图幅）</option><option value="tight">tight</option></select>
      </div>
      <label class="chk"><input type="checkbox" id="dwg" /> 导出 DWG</label>
      <button class="btn" id="go" disabled>开始置换</button>
    </div>
    <div class="status" id="status"></div>
  </div>

  <div class="card hidden" id="result">
    <div class="grid">
      <div class="pv"><div class="cap">替换前</div><img id="imgBefore" alt="before"/></div>
      <div class="pv"><div class="cap">替换后</div><img id="imgAfter" alt="after"/></div>
    </div>
    <div class="dl" id="dl"></div>
    <div class="diag" id="diag"></div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const drop = $('#drop'), fileInput = $('#file'), go = $('#go'), status = $('#status');

// 加载模板列表
fetch('/api/templates').then(r=>r.json()).then(d=>{
  const sel = $('#tpl');
  d.templates.forEach(t=>{ const o=document.createElement('option'); o.value=t.id; o.textContent=t.label; sel.appendChild(o); });
}).catch(()=>{});

drop.onclick = ()=> fileInput.click();
fileInput.onchange = e=>{ if(e.target.files[0]) pick(e.target.files[0]); };
['dragover','dragenter'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over');}));
['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over');}));
drop.ondrop = e=>{ const f=e.dataTransfer.files[0]; if(f) pick(f); };

let chosen=null;
function pick(f){
  if(!/\.(dxf|dwg)$/i.test(f.name)){ status.textContent='请选择 .dxf 或 .dwg 文件'; status.className='status err'; return; }
  chosen=f; drop.querySelector('.big').textContent='已选择：'+f.name; go.disabled=false; status.textContent=''; status.className='status';
}

go.onclick = async ()=>{
  if(!chosen) return;
  go.disabled=true; $('#result').classList.add('hidden');
  status.textContent='处理中…（DWG 转换 + 置换可能需 10–30 秒）'; status.className='status run';
  const fd=new FormData();
  fd.append('file', chosen);
  fd.append('template', $('#tpl').value);
  fd.append('fit', $('#fit').value);
  fd.append('export_dwg', $('#dwg').checked);
  try{
    const r=await fetch('/api/process',{method:'POST',body:fd});
    const d=await r.json();
    if(!r.ok){ throw new Error(d.detail||'处理失败'); }
    status.textContent='完成 ✓'; status.className='status';
    $('#imgBefore').src=d.preview.before||'';
    $('#imgAfter').src=d.preview.after||'';
    const dl=$('#dl'); dl.innerHTML='';
    for(const [k,v] of Object.entries(d.files)){
      const a=document.createElement('a'); a.href=v; a.textContent='下载 '+k.toUpperCase(); a.download=''; dl.appendChild(a);
    }
    $('#diag').textContent='诊断信息：\n'+JSON.stringify(d.diagnostics,null,2);
    $('#result').classList.remove('hidden');
  }catch(err){
    status.textContent='错误：'+err.message; status.className='status err';
  }finally{ go.disabled=false; }
};
</script>
</body>
</html>
